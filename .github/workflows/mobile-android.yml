# Builds the Android app. On every push it checks the app still builds.
# Run it by hand (Actions, "Android app", Run workflow) to build a signed release and upload it to Google Play.
# Secrets used (Settings, Secrets and variables, Actions), see mobile/STORE-SETUP.md:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON
name: Android app
on:
  push:
    branches: [Main]
    paths: ['mobile/**', 'src_app/**', 'designer/**', 'pwa_base/**', 'vendor_src/**', 'build.sh', 'build_saas.py', '.github/workflows/mobile-android.yml']
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track'
        type: choice
        options: [internal, alpha, production]
        default: alpha
      status:
        description: 'Release status (use "draft" until the app has been published once)'
        type: choice
        options: [draft, completed]
        default: draft
      version:
        description: 'Version shown to users'
        default: '1.0.0'
      upload:
        description: 'Upload to Google Play (leave off for the very first build: Google needs that one uploaded by hand)'
        type: boolean
        default: true
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build the website files
        run: bash build.sh
      - name: Copy them into the app
        working-directory: mobile
        run: npm ci && node prepare-www.mjs && npx cap sync android
      - name: Signing key
        id: key
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "file=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"; else echo "No signing key yet: building an unsigned check build."; fi
      - name: Build
        working-directory: mobile/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version || '1.0.0' }}
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then T="bundleRelease assembleRelease"; else T=assembleDebug; fi
          ./gradlew --no-daemon $T > "$RUNNER_TEMP/gradle.log" 2>&1 || { tail -80 "$RUNNER_TEMP/gradle.log"; grep -A6 "What went wrong" "$RUNNER_TEMP/gradle.log" | head -12 | tr '\n' ' ' | sed 's/^/::error::/'; echo; exit 1; }
      - name: Check what went into the app
        run: |
          f=$(ls mobile/android/app/build/outputs/apk/*/*.apk | head -1)
          python3 - "$f" <<'PY'
          import sys, zipfile, json
          z = zipfile.ZipFile(sys.argv[1]); n = set(z.namelist())
          h = z.read('assets/public/index.html').decode()
          site = h[h.find('DBD_SITE=') + 9:].split(';')[0]
          plugins = sorted(p['pkg'] for p in json.loads(z.read('assets/capacitor.plugins.json')))
          ok = 'assets/public/capacitor.js' in n and 'assets/public/privacy.html' in n and site.startswith('"https://')
          print(('::notice::' if ok else '::error::') + f"APK {sys.argv[1].split('/')[-1]}: site {site}, plugins {', '.join(plugins)}, {len(n)} files")
          sys.exit(0 if ok else 1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.run_number }}
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Upload to Google Play
        if: github.event_name == 'workflow_dispatch' && inputs.upload && steps.key.outputs.file != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.waveavi.dboarddesigner
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
